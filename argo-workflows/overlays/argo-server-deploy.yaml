apiVersion: apps/v1
kind: Deployment
metadata:
  name: argo-server
spec:
  replicas: 2
  template:
    spec:
      serviceAccountName: argo-server
      containers:
        - name: argo-server
          args:
            - server
            - --namespaced
            - --managed-namespace
            - workflow-playground
            - --auth-mode=sso
            - --auth-mode=client
            # No token: read-only, as argo-server (see resources/rbac/argo-server-read-only-clusterrole.yaml)
            - --auth-mode=server
            - --x-frame-options=SAMEORIGIN
