# Runs at the same minute as mutex-alpha, so the two contend for the
# mutex-demo lock. See mutex-workflowtemplate.yaml.
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: mutex-beta
spec:
  schedules:
    - '8,38 * * * *'
  workflowSpec:
    serviceAccountName: workflow
    arguments:
      parameters:
        - name: who
          value: beta
    workflowTemplateRef:
      name: mutex
